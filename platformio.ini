; PlatformIO Project Configuration for Waveshare ESP32-S3 Headless Wireless VESC Bridge
; Target: ESP32-S3 (16MB Flash, 8MB Octal PSRAM)
; Interfaces: Bluetooth LE (Nordic UART Service) + Wi-Fi SoftAP (TCP 6510) + USB CDC Serial

[env:waveshare-esp32-s3-bridge]
platform = espressif32
board = esp32-s3-devkitm-1
framework = arduino

; Serial monitor and upload
monitor_speed = 115200
upload_speed = 921600

; Memory & Flash Configuration (16MB Flash QIO, 8MB Octal PSRAM OPI)
board_build.arduino.memory_type = qio_opi
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216

; Compiler and Preprocessor Flags
build_flags = 
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -O3

lib_deps =
